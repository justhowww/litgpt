schema_version: 1

# R2-full (data size): R2 (regenerate to the frame end, no suffix in the input) on
# the full corpus (~920k videos minus the test-set sources) instead of ~65k.
# 82M model, global batch 16 (4 GPUs x micro 4), 100k steps (~1.6M windows, < 1
# epoch). Training on one node with 4 A100s; submit.py chains a 1-GPU eval job.
# Same test set and eval as R2. Question: does 14x more data improve content quality?
run:
  staged_corpus: /home/huangyh/scratch.metzler-prj/OpenVid-1M_Data/data-jpeglm
  model_tag: byte-jpeglm-gen-r2f-regen-nosuffix-full-12x768-bytes-ctx16k
  out_dir: /home/huangyh/scratch.metzler-prj/OpenVid-1M_Data/data-jpeglm/runs/byte-jpeglm-gen-r2f-regen-nosuffix-full-12x768-bytes-ctx16k

model:
  architecture: qwen3
  n_layer: 12
  n_embd: 768
  n_head: 12
  raw_context_bytes: 16384

data:
  max_rows: 0                 # full manifest; test-set sources are excluded automatically
  val_fraction: 0.01          # held-out sources (~9k videos), used only to pick the best checkpoint
  split_group: source
  num_workers: 8
  window_min_frames: 2

fim:
  p_fim: 1.0
  format: spm
  target: to_frame_end
  suffix_context: false
  fixed_holes_per_window: 0   # new hole every access
  span_loss_weight: 0
  eos_aux_loss_weight: 0
  min_gap: 64
  max_gap: 600

training:
  steps: 100000
  warmup_steps: 1000
  global_batch_size: 16
  micro_batch_size: 2           # per GPU; fits 40 GB A100s (micro 4 peaked at 41.8 GB); 4 GPUs x 2 x 2 accumulation
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  eval_interval: 2000
  save_interval: 25000         # also the rolling recovery checkpoint
  save_best_val: true
  activation_checkpointing: true
  compile: true

slurm:
  account: metzler-prj-cmsc
  mem: 320G
  time: "1-12:00:00"
  gpus: 4                     # 4x A100 FSDP training, then a 1-GPU eval job
  eval_time: "1-00:00:00"

eval:
  ffmpeg_binary: /home/huangyh/scratch.metzler-prj/miniforge3/bin/ffmpeg
  ffprobe_binary: /home/huangyh/scratch.metzler-prj/miniforge3/bin/ffprobe
  stop_modes: learned_eos
  checkpoint: best
  test_rows: "70000 70400"
  mask_modes: "off"
