schema_version: 1

# R2-L (model size): R2 (regenerate to the frame end, no suffix in the input) with
# a ~300M model (24 x 1024, as G4-L) instead of 82M. Same data (~65k videos),
# steps, test set and eval as R2. Question: does model size improve content quality
# (better/worse vs concealment, mean gain over all cuts)?
run:
  staged_corpus: /home/huangyh/scratch.metzler-prj/OpenVid-1M_Data/data-jpeglm
  model_tag: byte-jpeglm-gen-r2l-regen-nosuffix-65k-24x1024-bytes-ctx16k
  out_dir: /home/huangyh/scratch.metzler-prj/OpenVid-1M_Data/data-jpeglm/runs/byte-jpeglm-gen-r2l-regen-nosuffix-65k-24x1024-bytes-ctx16k

model:
  architecture: qwen3
  n_layer: 24
  n_embd: 1024
  n_head: 16
  raw_context_bytes: 16384

data:
  max_rows: 69632
  val_fraction: 0.06          # held-out sources, used only to pick the best checkpoint
  split_group: source
  num_workers: 8
  window_min_frames: 2

fim:
  p_fim: 1.0
  format: spm
  target: to_frame_end
  suffix_context: false
  fixed_holes_per_window: 0   # new hole every access
  span_loss_weight: 0
  eos_aux_loss_weight: 0
  min_gap: 64
  max_gap: 600

training:
  steps: 25000
  warmup_steps: 200
  global_batch_size: 16
  micro_batch_size: 2           # G4 (12x768) peaked at 41.8 GB with 4
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  eval_interval: 1000
  save_interval: 25000
  save_best_val: true
  activation_checkpointing: true
  compile: true

slurm:
  account: metzler-prj-cmsc
  mem: 96G
  time: "1-12:00:00"

eval:
  ffmpeg_binary: /home/huangyh/scratch.metzler-prj/miniforge3/bin/ffmpeg
  ffprobe_binary: /home/huangyh/scratch.metzler-prj/miniforge3/bin/ffprobe
  stop_modes: learned_eos
  checkpoint: best
  test_rows: "70000 70400"
  mask_modes: "off"
