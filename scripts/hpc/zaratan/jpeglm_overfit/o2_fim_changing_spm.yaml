schema_version: 1

# O2-SPM: O2 with SPM order [context, FIM_HOLE, suffix, FIM_BEGIN, prefix, middle].
# The middle continues straight from the prefix, so its first byte is the next
# byte of a memorized stream (O0's task) instead of a jump back from FIM_END.
# Simplest setup: plain Qwen3 byte transformer (patch 1), one GOP per window,
# plain next-byte CE over the whole sequence, one A100.
run:
  staged_corpus: /home/huangyh/scratch.metzler-prj/OpenVid-1M_Data/data-jpeglm
  model_tag: byte-jpeglm-overfit-o2-fim-changing-spm-12x768-bytes-ctx16k-9v
  out_dir: /home/huangyh/scratch.metzler-prj/OpenVid-1M_Data/data-jpeglm/runs/byte-jpeglm-overfit-o2-fim-changing-spm-12x768-bytes-ctx16k-9v

model:
  architecture: qwen3
  n_layer: 12
  n_embd: 768
  n_head: 12
  raw_context_bytes: 16384    # run F's context: 99.9% of GOPs fit whole

data:
  max_rows: 9                 # first 9 manifest videos
  val_fraction: 0.12          # -> 1 held-out video (reference only), 8 trained
  num_workers: 8
  window_min_frames: 2

fim:
  p_fim: 1.0
  format: spm
  fixed_holes_per_window: 0   # 0 = new hole every access
  span_loss_weight: 0         # no extra weighting: plain CE
  eos_aux_loss_weight: 0
  min_gap: 64
  max_gap: 600

training:
  steps: 20000                # ~16 x 20k / windows exposures per window
  warmup_steps: 200
  global_batch_size: 16
  micro_batch_size: 4
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  eval_interval: 1000
  save_interval: 5000
  activation_checkpointing: true
  compile: true

slurm:
  account: metzler-prj-cmsc
  mem: 96G
  time: "12:00:00"

eval:
  ffmpeg_binary: /home/huangyh/scratch.metzler-prj/miniforge3/bin/ffmpeg
  ffprobe_binary: /home/huangyh/scratch.metzler-prj/miniforge3/bin/ffprobe
